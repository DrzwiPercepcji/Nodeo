# Local development overlay: PostgreSQL + backend waits for DB health.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Set POSTGRES_HOST=postgres in `.env` (see `.env.example`).

services:
  postgres:
    image: postgres:16-alpine
    container_name: nodeo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nodeo}
      POSTGRES_USER: ${POSTGRES_USER:-nodeo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodeo}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
