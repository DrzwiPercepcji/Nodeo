# Pre-built images from GitHub Container Registry (default: DrzwiPercepcji/Nodeo, tag `latest`).
# Promote `latest-dev` → `latest` with Actions workflow "Promote Docker images (latest-dev → latest)".
# Override with NODEO_BACKEND_IMAGE / NODEO_FRONTEND_IMAGE (e.g. forks or private mirrors).
#
# Local development (build from this repo): add docker-compose.local.yml — it sets `build:` for backend and frontend.
# For image-only pull: `docker compose up -d` (no `--build`).

services:
  backend:
    image: ${NODEO_BACKEND_IMAGE:-ghcr.io/drzwipercepcji/nodeo-backend:latest}
    container_name: nodeo-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODEO_TEMP_DIR: /data/nodeo-tmp
    volumes:
      - nodeo_backend_tmp:/data/nodeo-tmp
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    image: ${NODEO_FRONTEND_IMAGE:-ghcr.io/drzwipercepcji/nodeo-frontend:latest}
    container_name: nodeo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  nodeo_backend_tmp:
