# Application services only (backend + frontend). No database in this file.
# For local Postgres, add: -f docker-compose.local.yml
# For E2E (Postgres + MinIO), add: -f docker-compose.local.yml -f docker-compose.e2e.yml

services:
  backend:
    build: ./backend
    container_name: nodeo-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build: ./frontend
    container_name: nodeo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
