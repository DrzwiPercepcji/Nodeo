name: CI

# Use Node 24 for JavaScript actions (checkout, setup-node, etc.); avoids Node 20 deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck & tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  frontend:
    name: Frontend (lint, types & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test
      - run: npm run build-only

  e2e:
    name: E2E (Docker Compose + Playwright + Gherkin)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps (bcrypt hash for .env)
        working-directory: backend
        run: npm ci

      - name: Write root .env for Compose
        run: |
          set -e
          HASH="$(cd backend && node -e "console.log(require('bcryptjs').hashSync('e2e-secret', 12))")"
          {
            echo "POSTGRES_HOST=postgres"
            echo "POSTGRES_PORT=5432"
            echo "POSTGRES_DB=nodeo"
            echo "POSTGRES_USER=nodeo"
            echo "POSTGRES_PASSWORD=e2e-postgres-secret"
            echo "AUTH_USERNAME=e2e-admin"
            echo "AUTH_PASSWORD_HASH=${HASH}"
            echo "JWT_SECRET=e2e-ci-jwt-secret-at-least-32-characters-long"
            echo "NODE_ENV=production"
            echo "BACKEND_PORT=3000"
            echo "FRONTEND_PORT=8080"
            echo "S3_BUCKET=nodeo-e2e"
            echo "S3_REGION=us-east-1"
            echo "S3_ACCESS_KEY=e2eaccess"
            echo "S3_SECRET_KEY=e2esecretkeymustbelongenough123"
            echo "S3_ENDPOINT=http://minio:9000"
          } > .env

      - name: Build and start stack
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml up -d --build

      - name: Wait for API (via frontend proxy)
        run: |
          set -e
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/api/health; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "Timeout waiting for /api/health"
          docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml logs --tail 200
          exit 1

      - name: Install ffmpeg and ensure media fixtures
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          mkdir -p e2e/fixtures
          if [ ! -f e2e/fixtures/sample.mp3 ]; then
            ffmpeg -y -f lavfi -i "sine=frequency=440:duration=1" -c:a libmp3lame -b:a 128k e2e/fixtures/sample.mp3
          fi
          if [ ! -f e2e/fixtures/sample.mp4 ]; then
            ffmpeg -y -f lavfi -i "testsrc=duration=1:size=320x240:rate=25" -c:v libx264 -pix_fmt yuv420p -movflags +faststart e2e/fixtures/sample.mp4
          fi

      - name: Install E2E deps and Playwright browser
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run Cucumber (Gherkin) scenarios
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npm test

      - name: Docker Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml logs --tail 300

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.e2e.yml down -v --remove-orphans

  publish-images:
    name: Publish images to GHCR (latest-dev)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: GHCR image names (lowercase)
        id: image
        run: |
          set -e
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "backend=${OWNER_LC}/${REPO_LC}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${OWNER_LC}/${REPO_LC}-frontend" >> "$GITHUB_OUTPUT"

      - name: OCI / tag helpers
        id: oci
        run: |
          set -e
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.image.outputs.backend }}:latest-dev
            ghcr.io/${{ steps.image.outputs.backend }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.backend }}:sha-${{ steps.oci.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Nodeo backend
            org.opencontainers.image.description=Nodeo API (Express, Node 24)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.version=sha-${{ steps.oci.outputs.short_sha }}
            org.opencontainers.image.created=${{ steps.oci.outputs.created }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.image.outputs.frontend }}:latest-dev
            ghcr.io/${{ steps.image.outputs.frontend }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.frontend }}:sha-${{ steps.oci.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Nodeo frontend
            org.opencontainers.image.description=Nodeo web UI (Vue 3, Vite, nginx)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.version=sha-${{ steps.oci.outputs.short_sha }}
            org.opencontainers.image.created=${{ steps.oci.outputs.created }}
